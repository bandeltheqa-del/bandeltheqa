<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="بند الثقة للمقاولات العامة - جودة والتزام وثقة في كل مشروع">
<title>بند الثقة | شركة سعودية</title>

<style>
:root{
--navy:#071a2b;
--navy-2:#0c263b;
--navy-3:#123a55;
--gold:#c9a45c;
--gold-light:#e5cf99;
--gold-dark:#9a7330;
--cream:#f5f2eb;
--white:#fff;
--text:#182838;
--muted:#6f7d8b;
--border:#e7e1d6;
--shadow:0 20px 60px rgba(7,26,43,.10);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
font-family:"Segoe UI",Tahoma,Arial,sans-serif;
background:var(--cream);
color:var(--text);
line-height:1.8;
overflow-x:hidden
}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
button{font-family:inherit}
.container{width:min(1180px,92%);margin:auto}

/* HEADER */
header{
position:fixed;
top:0;left:0;right:0;
z-index:1000;
background:rgba(7,26,43,.92);
border-bottom:1px solid rgba(229,207,153,.18);
backdrop-filter:blur(18px)
}
.nav{
min-height:82px;
display:flex;
align-items:center;
justify-content:space-between;
gap:30px
}
.logo{width:82px;height:62px;object-fit:contain}
.brand{display:flex;align-items:center;gap:11px;color:#fff}
.brand-name{font-size:15px;font-weight:800}
.brand-name small{display:block;color:var(--gold-light);font-size:9px}
.nav-links{display:flex;align-items:center;gap:30px;list-style:none}
.nav-links a{color:#fff;font-size:14px;font-weight:600;transition:.3s}
.nav-links a:hover{color:var(--gold-light)}
.menu-btn{display:none}

/* HERO */
.hero{
min-height:100vh;
display:flex;
align-items:center;
position:relative;
background:linear-gradient(135deg,#061725,#0b263b,#071a2b);
}
.hero-content{color:#fff;max-width:850px;padding-top:90px;position:relative;z-index:2}
.hero-kicker{color:var(--gold-light);margin-bottom:20px;font-weight:700}
.hero h1{font-size:clamp(45px,7vw,78px);line-height:1.2;margin-bottom:25px}
.hero h1 span{color:var(--gold-light)}
.hero p{color:#e7edf1;font-size:18px;max-width:700px;margin-bottom:38px}
.btn{
display:inline-flex;
align-items:center;
justify-content:center;
padding:14px 29px;
border-radius:9px;
background:linear-gradient(135deg,var(--gold-light),var(--gold));
color:var(--navy);
font-weight:800;
transition:.3s
}
.btn:hover{transform:translateY(-3px)}
.btn-outline{background:transparent;color:#fff;border:1px solid var(--gold);margin-right:10px}

/* GENERAL */
section{padding:100px 0}
.section-head{text-align:center;margin-bottom:60px}
.section-kicker{color:var(--gold-dark);font-weight:800}
.section-head h2{color:var(--navy);font-size:40px;margin:12px 0}
.section-head p{color:var(--muted);max-width:690px;margin:auto}

/* INTRO */
.intro-band{background:#fff}
.intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.intro-visual{
height:440px;
position:relative;
border-radius:26px;
background:linear-gradient(145deg,var(--navy),var(--navy-3));
display:flex;
align-items:center;
justify-content:center;
overflow:hidden
}
.b-emblem{
width:150px;height:150px;
border:2px solid var(--gold-light);
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}
.b-letter{font-size:120px;color:var(--gold-light);font-weight:bold}
.b-caption{position:absolute;bottom:35px;color:var(--gold-light);letter-spacing:4px}
.intro-text h2{font-size:40px;color:var(--navy);margin-bottom:20px}
.intro-text h2 span{color:var(--gold-dark)}
.intro-text p{color:var(--muted);margin-bottom:15px}

/* ABOUT */
.about{background:var(--cream)}
.about-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:center}
.about-text h3{font-size:30px;color:var(--navy);margin-bottom:18px}
.about-text p{color:var(--muted);margin-bottom:15px}
.about-box{
background:linear-gradient(145deg,var(--navy),var(--navy-2));
padding:50px;border-radius:22px;color:#fff
}
.about-box h3{color:var(--gold-light);font-size:28px;margin-bottom:15px}

/* SERVICES */
.services{background:#fff}
.services-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.service-card{
background:#fff;border:1px solid var(--border);
border-radius:16px;padding:34px 26px;transition:.3s
}
.service-card:hover{transform:translateY(-8px);box-shadow:var(--shadow)}
.service-number{color:var(--gold-dark);font-weight:800}
.service-card h3{color:var(--navy);margin:12px 0}
.service-card p{color:var(--muted);font-size:14px}

/* WHY */
.why{background:var(--cream)}
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.why-card{background:#fff;padding:34px 28px;border-radius:16px;border:1px solid var(--border)}
.why-card h3{color:var(--navy);margin:10px 0}
.why-card p{color:var(--muted)}

/* PROJECTS */
.projects{background:#fff}
.projects-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.project-card{border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:.3s}
.project-card:hover{transform:translateY(-8px);box-shadow:var(--shadow)}
.project-img{height:235px}
.project-img img{width:100%;height:100%;object-fit:cover}
.project-info{padding:21px}
.project-info small{color:var(--gold-dark)}
.project-info h3{color:var(--navy);font-size:18px}
.project-info p{color:var(--muted);font-size:13px}

/* CONTACT */
.contact{background:var(--cream)}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.contact-info{background:var(--navy);color:#fff;padding:45px;border-radius:22px}
.contact-info h3{color:var(--gold-light);font-size:30px}
.contact-points{margin-top:25px}
.contact-points div{padding:12px;border-bottom:1px solid #ffffff22}

/* SOCIAL ICONS */
.social-simple{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.social-simple-card{
min-height:150px;
background:#fff;
border:1px solid var(--border);
border-radius:18px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:12px;
transition:.3s
}
.social-simple-card:hover{transform:translateY(-7px);box-shadow:var(--shadow)}
.simple-icon{width:58px;height:58px;display:flex;align-items:center;justify-content:center}
.simple-icon svg{width:48px;height:48px}
.social-simple-card span{font-weight:800;color:var(--navy)}

/* FOOTER */
footer{background:#051522;color:#fff;padding:50px 0 25px}
.footer-row{display:flex;align-items:center;justify-content:space-between;gap:25px}
.footer-logo{width:76px;height:58px;object-fit:contain}
.footer-brand{display:flex;align-items:center;gap:11px}
.footer-brand-name small{color:var(--gold-light)}
.footer-text{color:#aebac4}
.footer-links{display:flex;gap:20px;font-size:13px}
.copyright{text-align:center;display:block;border-top:1px solid #ffffff22;margin-top:28px;padding-top:20px;color:#82909c;font-size:12px}
.ss{color:var(--gold);text-align:center}

/* GALLERY */
.gallery-modal{
position:fixed;inset:0;
background:rgba(2,10,17,.96);
z-index:2000;display:none;
align-items:center;justify-content:center;padding:25px
}
.gallery-modal.active{display:flex}
.gallery-inner{width:min(1100px,96vw);position:relative}
.gallery-main{height:65vh;display:flex;align-items:center;justify-content:center}
.gallery-main img,.gallery-main video{max-height:100%;max-width:100%;object-fit:contain}
.close-gallery,.gallery-arrow{
position:absolute;
background:rgba(0,0,0,.6);
color:#fff;border:1px solid #ffffff55;
cursor:pointer;border-radius:50%
}
.close-gallery{top:-40px;left:0;width:45px;height:45px;font-size:27px}
.gallery-arrow{top:50%;width:48px;height:48px;font-size:27px}
.prev{right:-60px}
.next{left:-60px}
.gallery-bottom{display:flex;justify-content:center;gap:15px;margin-top:20px}
.thumbs{display:flex;gap:7px;overflow:auto}
.thumbs img{width:65px;height:50px;object-fit:cover;cursor:pointer}
.video-thumb{width:65px;height:50px;background:#111;color:#fff;cursor:pointer}
.counter{color:#fff}

/* ANIMATION */
.reveal{opacity:0;transform:translateY(25px);transition:.7s}
.reveal.show{opacity:1;transform:none}

/* MOBILE */
@media(max-width:1000px){
.services-grid,.projects-grid{grid-template-columns:repeat(2,1fr)}
.about-grid,.intro-grid,.contact-grid{grid-template-columns:1fr}
}
@media(max-width:700px){
section{padding:75px 0}
.nav{min-height:74px}
.logo{width:62px;height:50px}
.menu-btn{display:block;background:transparent;color:#fff;border:1px solid #ffffff55;padding:8px 13px;font-size:23px;border-radius:8px}
.nav-links{
position:absolute;top:74px;right:4%;left:4%;
display:none;flex-direction:column;gap:0;
background:var(--navy);padding:10px
}
.nav-links.open{display:flex}
.nav-links a{display:block;padding:12px}
.hero h1{font-size:43px}
.hero p{font-size:16px}
.services-grid,.projects-grid,.why-grid,.social-simple{grid-template-columns:1fr}
.footer-row{flex-direction:column;text-align:center}
.prev{right:5px}.next{left:5px}
}
</style>
</head>
<body>
